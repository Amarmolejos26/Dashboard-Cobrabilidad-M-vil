<style>
:root{--ink:#12233A;--ink2:#586B82;--line:#DFE4EA;--bg:#EFF2F5;--acc:#ED7D31}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
.top{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px),linear-gradient(115deg,#0B2540,#123A5E 45%,#1F5A8C);border-bottom:4px solid var(--acc);height:120px}
.box{max-width:420px;margin:-60px auto 40px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(18,35,58,.1);padding:28px 28px 24px;text-align:center}
.ic{width:52px;height:52px;border-radius:14px;margin:0 auto 14px;background:linear-gradient(160deg,#F59A5B,#ED7D31 55%,#C15F1C);display:flex;align-items:center;justify-content:center}
h1{margin:0 0 8px;font-size:20px}p{margin:0 0 18px;color:var(--ink2);font-size:14px;line-height:1.5}
.go{display:block;width:100%;border:0;cursor:pointer;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:14.5px;padding:12px;border-radius:10px;text-decoration:none;text-align:center}
.go:disabled{opacity:.6;cursor:wait}
.fl{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.in{width:100%;padding:11px 12px;border:1px solid #C9D2DC;border-radius:10px;font:inherit;font-size:14.5px}
.err{margin-top:12px;color:#B42318;font-size:13px;min-height:18px}
.sp{width:34px;height:34px;border:3px solid #DCE3EA;border-top-color:var(--acc);border-radius:50%;margin:6px auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body>

<script>
(()=>{
const PORTAL='https://portal-gestion-comercial.github.io',LK='pgc_dk',MAXH=8,$=id=>document.getElementById(id);
const C=crypto.subtle,te=new TextEncoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const vig=t=>t&&Date.now()-t<MAXH*36e5&&new Date(t).toDateString()===new Date().toDateString();
const DEL=$('pgcData'),SHELL=('<!doctype html>\n'+document.documentElement.outerHTML).replace(/(<script id="pgcData" type="application\/octet-stream" data-iv=")[^"]*(">)[\s\S]*?(<\/script>)/,'$1__IV__$2__CT__$3');
const show=id=>['wait','deny','adm'].forEach(x=>$(x).hidden=x!==id);
async function gunzip(u8){const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text()}
async function gzip(txt){const s=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function wrap(html,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await C.encrypt({name:'AES-GCM',iv},key,await gzip(html));
  const t=(html.match(/<title>([^<]*)<\/title>/i)||[,''])[1];
  return SHELL.replace(/<title>[^<]*<\/title>/,'<title>'+t+'</title>').replace('__IV__',b64(iv)).replace('__CT__',b64(ct))}
async function boot(raw){show('wait');
  const key=await C.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
  const pt=await C.decrypt({name:'AES-GCM',iv:ub(DEL.dataset.iv)},key,ub(DEL.textContent.trim()));
  const html=await gunzip(new Uint8Array(pt));
  // las descargas de HTML (actualización local) salen cifradas
  const oc=HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click=function(){const a=this;
    if(a.download&&/\.html?$/i.test(a.download)&&String(a.href).startsWith('blob:')&&!a.__pgc){(async()=>{try{const txt=await (await fetch(a.href)).text();
      if(/<html/i.test(txt)&&!txt.includes('id="pgcData"'))a.href=URL.createObjectURL(new Blob([await wrap(txt,key)],{type:'text/html;charset=utf-8'}))}catch(e){console.error(e)}a.__pgc=1;oc.call(a)})();return}
    return oc.call(a)};
  document.open();document.write(html);document.close()}
function fromPortal(){return new Promise(res=>{if(!window.opener){res(null);return}
  const to=setTimeout(()=>res(null),5000);
  addEventListener('message',e=>{if(e.origin!==PORTAL||!e.data||e.data.pgc!=='key')return;clearTimeout(to);
    try{localStorage.setItem(LK,JSON.stringify({k:e.data.k,t:e.data.t}))}catch(_){}res(vig(e.data.t)?ub(e.data.k):null)});
  try{window.opener.postMessage({pgc:'ready'},PORTAL)}catch(_){clearTimeout(to);res(null)}})}
async function adminLogin(e){e.preventDefault();$('aerr').textContent='';$('ago').disabled=true;
  try{const A=JSON.parse($('pgcAdm').textContent),u=A.users.find(x=>x.u===$('au').value.trim().toLowerCase());if(!u)throw 0;
    const b=await C.importKey('raw',te.encode($('ap').value),'PBKDF2',false,['deriveKey']);
    const k=await C.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub(u.s),iterations:A.iter},b,{name:'AES-GCM',length:256},false,['decrypt']);
    const raw=new Uint8Array(await C.decrypt({name:'AES-GCM',iv:ub(u.iv)},k,ub(u.w)));
    try{sessionStorage.setItem(LK,JSON.stringify({k:b64(raw),t:Date.now()}))}catch(_){}await boot(raw)}
  catch(_){$('aerr').textContent='Usuario o clave incorrectos.';$('ago').disabled=false}}
$('adm').addEventListener('submit',adminLogin);
(async()=>{
  if(location.hash==='#salir'){try{localStorage.removeItem(LK);sessionStorage.removeItem(LK)}catch(_){}location.replace(PORTAL+'/');return}
  let s=null;try{s=JSON.parse((location.protocol==='file:'?sessionStorage:localStorage).getItem(LK)||'null')}catch(_){}
  if(s&&vig(s.t)){try{await boot(ub(s.k));return}catch(_){}}
  try{localStorage.removeItem(LK)}catch(_){}
  const raw=await fromPortal();if(raw){try{await boot(raw);return}catch(_){}}
  if(location.protocol==='file:'){show('adm');$('au').focus()}else show('deny');
})();
})();
</script>
